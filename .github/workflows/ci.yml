name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kasku
          POSTGRES_PASSWORD: kasku-dev
          POSTGRES_DB: kasku_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U kasku" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://kasku:kasku-dev@localhost:5432/kasku_test
      TEST_DATABASE_URL: postgresql://kasku:kasku-dev@localhost:5432/kasku_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t kasku-app:ci .
      - name: Compose smoke test
        run: |
          {
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 16)"
            echo "REDIS_PASSWORD=$(openssl rand -hex 16)"
            echo "APP_URL=http://localhost:8088"
            echo "DOMAIN=:80"
            echo "HTTP_PORT=8088"
            echo "HTTPS_PORT=8443"
            echo "COOKIE_SECURE=false"
          } > .env
          docker compose up -d --build --wait --wait-timeout 300 db redis app
          docker compose up -d worker caddy
          ok=
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8088/api/health; then ok=1; break; fi
            sleep 2
          done
          # Volume foto struk harus bisa ditulis oleh app dan worker.
          for s in app worker; do
            docker compose exec -T $s node -e "require('fs').writeFileSync('/data/receipts/.ci-'+process.argv[1],'ok')" $s
          done
          docker compose ps
          [ -n "$ok" ] || { docker compose logs; exit 1; }
      - name: Compose logs on failure
        if: failure()
        run: docker compose logs --tail 200
