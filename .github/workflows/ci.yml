name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kasku
          POSTGRES_PASSWORD: kasku-dev
          POSTGRES_DB: kasku_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U kasku" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://kasku:kasku-dev@localhost:5432/kasku_test
      TEST_DATABASE_URL: postgresql://kasku:kasku-dev@localhost:5432/kasku_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t kasku-app:ci .
