# Hanya untuk development lokal: Postgres di 127.0.0.1:5432 (+ database kasku_test).
#   docker compose -f docker-compose.dev.yml up -d
name: kasku-dev

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: kasku
      POSTGRES_USER: kasku
      POSTGRES_PASSWORD: kasku-dev
      TZ: Asia/Jakarta
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata-dev:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro

  # Opsional untuk mencoba antrean saat development.
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"


volumes:
  pgdata-dev:
