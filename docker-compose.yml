# Kasku — deployment self-hosted.
# Jalankan: docker compose up -d --build
# Semua rahasia dibaca dari file .env (lihat .env.example).

name: kasku

# Konfigurasi struk yang dipakai bersama oleh app dan worker.
x-receipt-env: &receipt-env
  REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
  STORAGE_DRIVER: s3
  S3_ENDPOINT: http://minio:9000
  S3_BUCKET: ${S3_BUCKET:-kasku-receipts}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY}
  S3_SECRET_KEY: ${S3_SECRET_KEY}
  S3_REGION: us-east-1
  S3_FORCE_PATH_STYLE: "true"
  RECEIPT_PROVIDER: ${RECEIPT_PROVIDER:-tesseract}
  RECEIPT_HTTP_URL: ${RECEIPT_HTTP_URL:-}
  RECEIPT_HTTP_TOKEN: ${RECEIPT_HTTP_TOKEN:-}

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kasku}
      POSTGRES_USER: ${POSTGRES_USER:-kasku}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Isi POSTGRES_PASSWORD di .env}
      TZ: Asia/Jakarta
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [internal]

  app:
    build: .
    image: kasku-app:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-kasku}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-kasku}?schema=public
      APP_URL: ${APP_URL:?Isi APP_URL di .env}
      SESSION_TTL_DAYS: ${SESSION_TTL_DAYS:-30}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      TELEGRAM_ALLOWED_USER_IDS: ${TELEGRAM_ALLOWED_USER_IDS:-}
      <<: *receipt-env
      TZ: Asia/Jakarta
    networks: [internal, web]
    # Port tidak dibuka ke host; akses lewat Caddy.

  # Worker pembaca struk (OCR) dari antrean BullMQ. Image sama dengan app.
  worker:
    image: kasku-app:latest
    restart: unless-stopped
    depends_on:
      app:
        condition: service_started
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    command: ["node_modules/.bin/tsx", "src/worker/index.ts"]
    environment:
      RUN_MIGRATIONS: "false" # migrasi dijalankan oleh service app
      DATABASE_URL: postgresql://${POSTGRES_USER:-kasku}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-kasku}?schema=public
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      RECEIPT_WORKER_CONCURRENCY: ${RECEIPT_WORKER_CONCURRENCY:-1}
      REMINDER_INTERVAL_MINUTES: ${REMINDER_INTERVAL_MINUTES:-15}
      TESSERACT_CACHE_DIR: /data/tesseract
      <<: *receipt-env
      TZ: Asia/Jakarta
    volumes:
      - tesseract_data:/data/tesseract
    healthcheck:
      disable: true
    networks: [internal]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?Isi REDIS_PASSWORD di .env}"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    networks: [internal]

  # Penyimpanan foto struk (S3-compatible). Hanya di jaringan internal, tanpa port publik
  # dan tanpa bucket publik: foto hanya bisa dibuka lewat aplikasi setelah login.
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?Isi S3_ACCESS_KEY di .env}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?Isi S3_SECRET_KEY di .env}
      MINIO_BROWSER: "off"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [internal]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [app]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [web]

  # Backup harian otomatis (pg_dump) ke ./backups, disimpan BACKUP_KEEP_DAYS hari.
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER:-kasku}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-kasku}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      TZ: Asia/Jakarta
    volumes:
      - ./backups:/backups
      - ./docker/backup-loop.sh:/backup-loop.sh:ro
    entrypoint: ["/bin/sh", "/backup-loop.sh"]
    networks: [internal]

volumes:
  pgdata:
  redisdata:
  miniodata:
  tesseract_data:
  caddy_data:
  caddy_config:

networks:
  internal:
  web:
